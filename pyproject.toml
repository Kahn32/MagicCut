[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magiccut"
version = "0.1.0"
description = "Reproducible research extension of Material Magic Wand with uncertainty-aware graph inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<1",
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "numpy>=1.26,<3",
  "objaverse>=0.1.7,<1",
  "pillow>=10,<12",
  "pymaxflow>=1.3,<2",
  "scikit-learn>=1.5,<2",
  "timm>=1.0.20,<2",
  "torch>=2.4,<3",
  "trimesh>=4.8,<5",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/magiccut"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
]
